    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('eduasist_theme') || localStorage.getItem('educontrol_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = savedTheme === 'dark' || (!savedTheme && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#000000] text-slate-900 dark:text-[#F4F4F5] font-sans antialiased min-h-screen transition-colors">
